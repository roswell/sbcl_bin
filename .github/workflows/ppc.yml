name: PPC

on:
  schedule:
    - cron:  '30 1 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ secrets.VERSION }}
      ARCH: ppc
      TARGET: ppc
      SUFFIX: ''
      ROSWELL_BRANCH: master
      GITHUB_OAUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    environment: SET_VERSION

    steps:
      - uses: actions/checkout@v4
      - name: setenv
        run: |
          echo "$HOME/.roswell/bin" >> $GITHUB_PATH
          echo "ROSWELL_BRANCH=release" >> $GITHUB_ENV
      - name: Install Roswell
        env:
          LISP: sbcl-bin/2.4.8
        run: |
          curl -L https://raw.githubusercontent.com/roswell/roswell/master/scripts/install-for-ci.sh | sh
          ros install snmsts/sn.github roswell/sbcl_bin
      - name: check uploaded
        id: check_uploaded
        run: make latest-version upload-archive-p
        continue-on-error: true
      - name: install qemu
        if: ${{ steps.check_uploaded.outcome == 'failure' || github.event_name != 'schedule' }}
        run: sudo apt-get update && sudo apt-get install -y qemu-system-ppc
      - name: boot the vm
        if: ${{ steps.check_uploaded.outcome == 'failure' || github.event_name != 'schedule' }}
        run: |
          make latest-version sbcl zstd
          make boot-qemu
      - name: compile-config on ppc
        if: ${{ steps.check_uploaded.outcome == 'failure' || github.event_name != 'schedule' }}
        run: |
          QEMU_ACTION='sh ./tools-for-build/ppc/setup; make latest-version compile-config' make qemu
      - name: make-host-1
        if: ${{ steps.check_uploaded.outcome == 'failure' || github.event_name != 'schedule' }}
        run: bash -c "cd sbcl;sh make-host-1.sh"
      - name: build-runtime on ppc
        if: ${{ steps.check_uploaded.outcome == 'failure' || github.event_name != 'schedule' }}
        run: QEMU_ACTION='cd sbcl; sh make-target-1.sh' make qemu
      - name: make-host-2
        if: ${{ steps.check_uploaded.outcome == 'failure' || github.event_name != 'schedule' }}
        run: bash -c "cd sbcl;sh make-host-2.sh"
      - name: build-target2 and contrib on ppc
        if: ${{ steps.check_uploaded.outcome == 'failure' || github.event_name != 'schedule' }}
        run: |
          QEMU_ACTION='cd sbcl; sh make-target-2.sh && sh make-target-contrib.sh; cd ..; make compile-9' make qemu
      - name: upload
        if: ${{ steps.check_uploaded.outcome == 'failure' || github.event_name != 'schedule' }}
        run: |
          make latest-version archive
          ls
          ls *.bz2 |xargs -i env FILE={} make latest-version upload-archive
      - name: stop the vm
        if: always()
        run: make stop-qemu
